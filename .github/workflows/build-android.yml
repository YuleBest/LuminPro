name: Build & Package Module

on:
  push:
    branches: [main, beta, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. WebUI ────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm build:webui

      # ── 2. luminpro 二进制 (Go) ─────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test Go packages
        working-directory: go
        run: |
          go vet ./...
          go test ./...

      - name: Build luminpro (android/arm64)
        working-directory: go
        run: |
          mkdir -p ../bin
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/luminpro ./cmd/luminpro
          chmod +x ../bin/luminpro

      # ── 3. 判定发布通道 ─────────────────────────────────────────────────
      # tag 含 -beta → beta 通道（prerelease）；其余 tag → stable；
      # 分支构建：dev → dev、beta → beta、main → stable（仅出 artifact）
      - name: Resolve release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-beta* ]]; then
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${GITHUB_REF_NAME}" in
              dev) echo "channel=dev" >> "$GITHUB_OUTPUT" ;;
              beta) echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
              *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. 打包模块 ─────────────────────────────────────────────────────
      - name: Package module
        run: node build-module.js --channel=${{ steps.channel.outputs.channel }}

      # ── 5a. tag 构建：创建 GitHub Release 并上传资产 ─────────────────────
      # Release 资产文件名必须与更新清单里的 zipUrl 完全一致
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '[:space:]')
          ZIP="LuminPro_${VERSION}.zip"
          NOTES=$(awk '/^## / { if (p) exit; p=1; next } p { print }' changelog.md)
          [ -n "$NOTES" ] || NOTES="自动构建产物"
          FLAGS=""
          if [ "${{ steps.channel.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" "$ZIP" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            $FLAGS

      # ── 5b. 分支构建：重命名后作为 artifact 上传 ────────────────────────
      - name: Rename artifact with commit hash
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: names
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          FINAL="LuminPro_${VERSION}-${SHORT_SHA}.zip"
          mv "LuminPro_${VERSION}.zip" "$FINAL"
          echo "zip=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Upload module zip
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.zip }}
          path: ${{ steps.names.outputs.zip }}
          if-no-files-found: error
